<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p-overlap-icon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B0609" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3B0305" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="48" fill="#000000" />
  
  <g transform="translate(24, 60) scale(1.02)">
    <!-- Outer hairline -->
    <path d="M 46,28 L 152,28 C 196,28 230,58 230,110 C 230,154 200,185 154,185 L 114,185 L 114,242 L 46,242 Z"
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" opacity="0.9" />
    <circle cx="236" cy="118" r="88" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />

    <!-- Unified white casing -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round">
      <path d="M 52,34 L 148,34 C 192,34 224,64 224,112 C 224,156 194,182 148,182 L 110,182 L 110,236 L 52,236 Z" />
      <circle cx="236" cy="118" r="82" />
    </g>
    <!-- Black separator -->
    <g fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round">
      <path d="M 52,34 L 148,34 C 192,34 224,64 224,112 C 224,156 194,182 148,182 L 110,182 L 110,236 L 52,236 Z" />
      <circle cx="236" cy="118" r="82" />
    </g>
    <!-- Letter O -->
    <circle cx="236" cy="118" r="78" fill="#000000" stroke="#FFFFFF" stroke-width="7" />
    <circle cx="236" cy="118" r="42" fill="#000000" />
    <!-- Droplet -->
    <path d="M 236,88 C 236,88 214,116 214,132 C 214,144 224,152 236,152 C 248,152 258,144 258,132 C 258,116 236,88 236,88 Z"
          fill="#FFFFFF" />
    <!-- Letter P -->
    <path d="M 54,36 L 142,36 C 188,36 216,66 216,112 C 216,156 188,180 142,180 L 105,180 L 105,234 L 54,234 Z"
          fill="#E11D24" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" />
    <!-- Overlap -->
    <path d="M 160,54 C 198,70 214,96 214,112 C 214,148 192,170 165,178 C 186,164 198,138 198,112 C 198,86 182,64 160,54 Z"
          fill="url(#p-overlap-icon)" />
    <!-- P hole -->
    <path d="M 105,74 L 138,74 C 160,74 174,88 174,112 C 174,136 160,148 138,148 L 105,148 Z"
          fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>