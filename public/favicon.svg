<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Facet gradient for 3D lower-right fold on letter D -->
    <linearGradient id="d-facet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Translucent overlay for P overlap onto O -->
    <linearGradient id="p-overlap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B0609" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3B0305" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Solid pitch black canvas matching the exact photo -->
  <rect width="800" height="400" fill="#000000" />

  <!-- ============================================================ -->
  <!-- MAIN PODA EMBLEM (P, O, D, A)                                 -->
  <!-- ============================================================ -->
  <g id="poda-emblem" transform="translate(40, 24)">

    <!-- LAYER 0: OUTERMOST WHITE HAIRLINE WIREFRAME OUTLINE -->
    <!-- Traces around the entire badge with a 6px black offset channel -->
    <path d="
      M 104,50
      L 225,50
      C 260,50 286,59 308,76
      C 324,64 345,56 368,56
      C 390,56 410,63 426,74
      C 446,59 472,50 502,50
      L 580,50
      C 606,50 630,62 646,82
      L 674,124
      L 748,272
      C 752,280 748,290 738,290
      L 680,290
      C 672,290 665,285 662,277
      L 648,232
      L 620,232
      L 606,277
      C 603,285 596,290 588,290
      L 488,290
      C 455,290 428,280 406,263
      C 388,277 366,286 342,286
      C 318,286 296,277 278,263
      C 264,272 248,278 230,282
      L 174,282
      L 174,288
      C 174,292 170,296 166,296
      L 104,296
      C 98,296 94,292 94,286
      L 94,60
      C 94,54 98,50 104,50 Z
    " fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" opacity="0.95" />

    <!-- LAYER 1: BLACK SEPARATOR CHANNEL -->
    <!-- Sits between the outer hairline and the thick white badge contour -->
    <path d="
      M 110,56
      L 225,56
      C 256,56 280,64 300,79
      C 317,68 337,61 360,61
      C 382,61 401,68 417,78
      C 436,65 460,56 488,56
      L 576,56
      C 600,56 622,67 637,85
      L 664,127
      L 736,268
      L 686,268
      L 671,224
      L 625,224
      L 612,268
      L 488,268
      C 458,268 433,258 412,243
      C 396,256 376,264 354,264
      C 331,264 311,256 295,243
      C 281,251 266,257 250,260
      L 180,260
      L 180,274
      L 110,274 Z
    " fill="#000000" stroke="#000000" stroke-width="6" stroke-linejoin="round" />

    <!-- LAYER 2: UNIFIED THICK WHITE BADGE CASING -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
      <!-- P envelope -->
      <path d="M 115,62 L 222,62 C 274,62 308,94 308,144 C 308,194 274,226 222,226 L 175,226 L 175,268 L 115,268 Z" />
      <!-- O envelope -->
      <circle cx="346" cy="162" r="98" />
      <!-- D envelope -->
      <path d="M 405,62 L 485,62 C 555,62 598,104 598,162 C 598,220 555,262 485,262 L 405,262 Z" />
      <!-- A envelope -->
      <polygon points="575,268 655,62 735,268 680,268 668,220 642,220 630,268" />
    </g>

    <!-- LAYER 3: BLACK SEPARATOR CONTOURS -->
    <g fill="#000000" stroke="#000000" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 115,62 L 222,62 C 274,62 308,94 308,144 C 308,194 274,226 222,226 L 175,226 L 175,268 L 115,268 Z" />
      <circle cx="346" cy="162" r="98" />
      <path d="M 405,62 L 485,62 C 555,62 598,104 598,162 C 598,220 555,262 485,262 L 405,262 Z" />
      <polygon points="575,268 655,62 735,268 680,268 668,220 642,220 630,268" />
    </g>

    <!-- LAYER 4: LETTER A (Black body, crisp white outline, triangular inner counter) -->
    <g id="letter-A">
      <polygon points="580,265 655,65 730,265 682,265 667,218 643,218 628,265"
               fill="#000000" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" />
      <!-- Inner triangular counter of A -->
      <polygon points="655,122 672,192 638,192"
               fill="#000000" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    </g>

    <!-- LAYER 5: LETTER D (Solid White body with black counter & bottom-right facet) -->
    <g id="letter-D">
      <!-- Solid White outer D body -->
      <path d="M 400,65 L 482,65 C 550,65 592,106 592,162 C 592,218 550,259 482,259 L 400,259 Z"
            fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

      <!-- Distinct bottom-right 3D angled facet (from original photo) -->
      <path d="M 542,212 C 570,188 592,162 592,162 C 592,218 550,259 482,259 L 478,259 L 492,212 Z"
            fill="url(#d-facet-grad)" opacity="0.9" />

      <!-- Inner black D counter hole (NO white stroke inside - crisp black against white body) -->
      <path d="M 445,106 L 476,106 C 514,106 536,128 536,162 C 536,196 514,218 476,218 L 445,218 Z"
            fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- LAYER 6: LETTER O (Black circle with thick white circular border & white liquid droplet) -->
    <g id="letter-O">
      <!-- Black circular body with thick white outer stroke -->
      <circle cx="346" cy="162" r="95" fill="#000000" stroke="#FFFFFF" stroke-width="8" />

      <!-- Inner black circle cavity -->
      <circle cx="346" cy="162" r="50" fill="#000000" />

      <!-- WHITE LIQUID DROPLET (Teardrop pointing straight up to 12 oclock) -->
      <path d="
        M 346,124
        C 346,124 322,160 322,178
        C 322,192 332,203 346,203
        C 360,203 370,192 370,178
        C 370,160 346,124 346,124 Z
      " fill="#FFFFFF" />
    </g>

    <!-- LAYER 7: LETTER P (Vibrant Red #E11D24 with crisp white outline & overlap on O) -->
    <g id="letter-P">
      <!-- Solid red P body with white outline -->
      <path d="M 120,65 L 220,65 C 274,65 306,96 306,144 C 306,192 274,222 220,222 L 175,222 L 175,265 L 120,265 Z"
            fill="#E11D24" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />

      <!-- Natural darker red overlap shadow where P loops over the black letter O -->
      <path d="M 240,82 C 285,98 304,128 304,144 C 304,184 282,210 248,218 C 270,202 284,175 284,144 C 284,116 266,93 240,82 Z"
            fill="url(#p-overlap-grad)" />

      <!-- Inner counter of P: solid black without white stroke, matching the photo -->
      <path d="M 175,105 L 214,105 C 240,105 255,120 255,144 C 255,168 240,182 214,182 L 175,182 Z"
            fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
    </g>

  </g>

  <!-- ============================================================ -->
  <!-- SUBTEXT: E - L I Q U I D   C O M P A N Y                     -->
  <!-- Vectorized geometric techno glyphs from the original logo     -->
  <!-- ============================================================ -->
  <g id="poda-subtext" fill="#FFFFFF" transform="translate(400, 334)">
    <g transform="translate(-254, 0)">
      <!-- E -->
      <path d="M 0,-24 L 20,-24 C 23,-24 25,-22 25,-19 L 25,-18 L 6,-18 L 6,-14 L 21,-14 L 21,-10 L 6,-10 L 6,-6 L 25,-6 L 25,-5 C 25,-2 23,0 20,0 L 0,0 C -3,0 -5,-2 -5,-5 L -5,-19 C -5,-22 -3,-24 0,-24 Z" />

      <!-- - -->
      <rect x="33" y="-14" width="12" height="4" rx="2" />

      <!-- L -->
      <path d="M 53,-24 L 59,-24 L 59,-6 L 75,-6 C 77,-6 78,-4 78,-2 L 78,0 L 53,0 C 50,0 48,-2 48,-5 L 48,-19 C 48,-22 50,-24 53,-24 Z" />

      <!-- I -->
      <rect x="86" y="-24" width="6" height="24" rx="1.5" />

      <!-- Q -->
      <path d="M 104,-24 L 120,-24 C 124,-24 126,-22 126,-18 L 126,-6 C 126,-2 124,0 120,0 L 104,0 C 100,0 98,-2 98,-6 L 98,-18 C 98,-22 100,-24 104,-24 Z M 104,-19 C 103,-19 103,-18 103,-17 L 103,-7 C 103,-6 103,-5 104,-5 L 120,-5 C 121,-5 121,-6 121,-7 L 121,-17 C 121,-18 121,-19 120,-19 Z" />
      <polygon points="116,-9 128,4 122,5 113,-6" />

      <!-- U -->
      <path d="M 136,-24 L 142,-24 L 142,-6 C 142,-5 143,-5 144,-5 L 156,-5 C 157,-5 158,-5 158,-6 L 158,-24 L 164,-24 L 164,-6 C 164,-2 161,0 157,0 L 143,0 C 139,0 136,-2 136,-6 Z" />

      <!-- I -->
      <rect x="172" y="-24" width="6" height="24" rx="1.5" />

      <!-- D -->
      <path d="M 186,-24 L 202,-24 C 209,-24 213,-20 213,-12 C 213,-4 209,0 202,0 L 186,0 C 183,0 181,-2 181,-5 L 181,-19 C 181,-22 183,-24 186,-24 Z M 187,-19 L 187,-5 L 201,-5 C 205,-5 207,-8 207,-12 C 207,-16 205,-19 201,-19 Z" />

      <!-- C -->
      <path d="M 252,-24 L 270,-24 C 273,-24 275,-22 275,-19 L 275,-17 L 269,-17 L 269,-19 L 253,-19 C 252,-19 251,-18 251,-17 L 251,-7 C 251,-6 252,-5 253,-5 L 269,-5 L 269,-7 L 275,-7 L 275,-5 C 275,-2 273,0 270,0 L 252,0 C 248,0 245,-3 245,-7 L 245,-17 C 245,-21 248,-24 252,-24 Z" />

      <!-- O -->
      <path d="M 288,-24 L 305,-24 C 309,-24 312,-21 312,-17 L 312,-7 C 312,-3 309,0 305,0 L 288,0 C 284,0 281,-3 281,-7 L 281,-17 C 281,-21 284,-24 288,-24 Z M 288,-19 C 287,-19 287,-18 287,-17 L 287,-7 C 287,-6 287,-5 288,-5 L 305,-5 C 306,-5 306,-6 306,-7 L 306,-17 C 306,-18 306,-19 305,-19 Z" />

      <!-- M -->
      <path d="M 321,-24 L 327,-24 L 334,-10 L 341,-24 L 347,-24 L 347,0 L 341,0 L 341,-14 L 336,-4 L 332,-4 L 327,-14 L 327,0 L 321,0 Z" />

      <!-- P -->
      <path d="M 356,-24 L 372,-24 C 376,-24 379,-21 379,-17 L 379,-11 C 379,-7 376,-4 372,-4 L 362,-4 L 362,0 L 356,0 Z M 362,-19 L 362,-9 L 371,-9 C 372,-9 373,-10 373,-11 L 373,-17 C 373,-18 372,-19 371,-19 Z" />

      <!-- A -->
      <path d="M 394,-24 L 401,-24 L 413,0 L 406,0 L 403,-6 L 392,-6 L 389,0 L 382,0 Z M 394,-11 L 401,-11 L 397,-19 Z" />

      <!-- N -->
      <path d="M 421,-24 L 427,-24 L 439,-6 L 439,-24 L 445,-24 L 445,0 L 439,0 L 427,-18 L 427,0 L 421,0 Z" />

      <!-- Y -->
      <path d="M 453,-24 L 460,-24 L 467,-13 L 474,-24 L 481,-24 L 470,-7 L 470,0 L 464,0 L 464,-7 Z" />
    </g>
  </g>
</svg>